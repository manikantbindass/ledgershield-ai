services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      RECOVERY_MODE: observe_only
      LEDGERSHIELD_OPERATOR_TOKEN: ${LEDGERSHIELD_OPERATOR_TOKEN:-}
      LEDGERSHIELD_ADMIN_TOKEN: ${LEDGERSHIELD_ADMIN_TOKEN:-}
  frontend:
    build: ./frontend
    environment:
      API_TARGET: http://backend:8000
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - backend
