<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="190" viewBox="0 0 1200 190" role="img" aria-labelledby="title desc"><title id="title">LedgerShield resilience loop</title><desc id="desc">An animated signal follows the observe, detect, assess, recover, verify cycle.</desc><rect width="1200" height="190" rx="16" fill="#0e1b26"/><path d="M80 75H1120" stroke="#2d5148" stroke-width="2"/><g fill="#142e27" stroke="#8de9c0"><circle cx="120" cy="75" r="8"/><circle cx="360" cy="75" r="8"/><circle cx="600" cy="75" r="8"/><circle cx="840" cy="75" r="8"/><circle cx="1080" cy="75" r="8"/></g><circle r="5" fill="#c1ffe0"><animateMotion dur="7s" repeatCount="indefinite" path="M80 75H1120"/><animate attributeName="opacity" values="0;1;1;0" dur="7s" repeatCount="indefinite"/></circle><g text-anchor="middle" fill="#8de9c0" font-family="monospace" font-size="13" letter-spacing="2"><text x="120" y="116">OBSERVE</text><text x="360" y="116">DETECT</text><text x="600" y="116">ASSESS</text><text x="840" y="116">RECOVER</text><text x="1080" y="116">VERIFY</text></g><text x="600" y="159" text-anchor="middle" fill="#728d9e" font-family="Segoe UI,Arial,sans-serif" font-size="13">LedgerShield · measurable resilience, explainable decisions · local research simulator</text></svg>
