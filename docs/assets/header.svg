<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="370" viewBox="0 0 1200 370" role="img" aria-labelledby="title desc">
<title id="title">LedgerShield — observe, verify, recover</title><desc id="desc">Animated signed messages move between validators around a shield. A failed node pulses amber, then returns to green.</desc>
<defs><linearGradient id="bg"><stop stop-color="#0c1623"/><stop offset="1" stop-color="#102e2b"/></linearGradient><pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#8de9c0" stroke-opacity=".06"/></pattern><filter id="glow"><feGaussianBlur stdDeviation="4"/></filter></defs>
<rect width="1200" height="370" rx="18" fill="url(#bg)"/><rect width="1200" height="370" rx="18" fill="url(#grid)"/>
<g stroke="#426d67" fill="none"><path d="M835 95L1025 95L1090 210L930 292L780 215Z"/><path d="M835 95L930 190L1025 95M780 215L930 190L1090 210M930 292V190"/><circle cx="930" cy="190" r="126" stroke-dasharray="3 9" stroke-opacity=".4"><animateTransform attributeName="transform" type="rotate" from="0 930 190" to="360 930 190" dur="55s" repeatCount="indefinite"/></circle></g>
<g fill="#8de9c0"><circle r="4"><animateMotion dur="3s" repeatCount="indefinite" path="M835 95L930 190L1090 210"/></circle><circle r="4"><animateMotion dur="4s" repeatCount="indefinite" path="M780 215L930 190L1025 95"/></circle><circle r="4"><animateMotion dur="3.5s" repeatCount="indefinite" path="M930 292L930 190L835 95"/></circle></g>
<path d="M930 140L968 157V192Q964 223 930 243Q896 223 892 192V157Z" fill="#163e34" stroke="#8de9c0" stroke-width="2"/><path d="M912 189L925 202L949 175" stroke="#8de9c0" stroke-width="4" fill="none"/>
<g fill="#10241f" stroke="#8de9c0" stroke-width="2"><circle cx="835" cy="95" r="12"/><circle cx="1025" cy="95" r="12"/><circle cx="780" cy="215" r="12"/><circle cx="930" cy="292" r="12"/><circle cx="1090" cy="210" r="12"><animate attributeName="stroke" values="#8de9c0;#efad72;#efad72;#8de9c0;#8de9c0" dur="8s" repeatCount="indefinite"/></circle></g>
<circle cx="1090" cy="210" r="18" fill="none" stroke="#efad72"><animate attributeName="r" values="14;30;14" dur="4s" repeatCount="indefinite"/><animate attributeName="opacity" values=".7;0;.7" dur="4s" repeatCount="indefinite"/></circle>
<text x="64" y="83" fill="#8de9c0" font-family="monospace" font-size="13" letter-spacing="3">BLOCKCHAIN RESILIENCE / RESEARCH LAB</text>
<text x="60" y="170" fill="#edf5f3" font-family="Segoe UI,Arial,sans-serif" font-weight="700" font-size="74" letter-spacing="-3">LedgerShield<tspan fill="#8de9c0">.</tspan></text>
<text x="64" y="217" fill="#a7b9c6" font-family="Segoe UI,Arial,sans-serif" font-size="22">Observe the network. Explain the evidence.</text><text x="64" y="249" fill="#a7b9c6" font-family="Segoe UI,Arial,sans-serif" font-size="22">Recover with guardrails.</text>
<rect x="64" y="289" width="491" height="35" rx="6" fill="#152c2b" stroke="#35584d"/><circle cx="82" cy="307" r="4" fill="#8de9c0"><animate attributeName="opacity" values="1;.3;1" dur="2s" repeatCount="indefinite"/></circle><text x="98" y="312" fill="#8de9c0" font-family="monospace" font-size="12">SIGNED TRANSFERS · FIXED QUORUMS · SAFE RECOVERY</text>
