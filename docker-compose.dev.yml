services:
  backend:
    command: ["sh", "-c", "alembic upgrade head && exec uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload --no-access-log"]
    volumes:
      - ./backend:/app/backend:ro
      - ./ledgershield:/app/ledgershield:ro
  frontend:
    build:
      target: build
    user: node
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "8080", "--strictPort"]
    environment:
      API_TARGET: http://backend:8000
    volumes:
      - ./frontend/src:/app/src:ro
