[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100
include = ["backend/**/*.py", "ledgershield/**/*.py", "tests/**/*.py", "migrations/**/*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.12"
files = ["backend/persistence.py", "backend/models.py"]
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
follow_imports = "silent"
